[package]
name = "oscillate"
version = "0.1.0"
description = "A thin client over Claude Code's supervisor daemon"
authors = ["Khalil Brewington"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oscillate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the transparent window the glass shows through (`glass.rs`).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
# "Add repo…"'s folder picker, called from Rust only.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify = "8"
libc = "0.2"
# The e2e harness only (`npm run e2e`): WebdriverIO's embedded driver, the one that
# works on macOS. Never in `tauri dev` or a release build.
tauri-plugin-wdio = { version = "1.4", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

# Notifications (`notifications.rs`): our own UNUserNotificationCenter delegate, not a plugin
# (PLAN-notifications.md). All four were already in Cargo.lock through tao and wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# The glass (`glass.rs`); already in Cargo.lock through tao.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGlassEffectView",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
